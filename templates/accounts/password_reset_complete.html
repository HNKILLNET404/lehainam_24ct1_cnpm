{% extends 'base.html' %}

{% block title %}Đặt lại mật khẩu thành công - Urban Threads{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 bg-gray-50">
    <div class="max-w-md w-full text-center bg-white p-8 rounded-xl shadow-sm border border-gray-100">
        <div class="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-5 text-2xl">
            <i class="fas fa-check-circle"></i>
        </div>
        <h2 class="text-2xl font-bold uppercase tracking-tight text-gray-900 mb-3">
            Đặt lại mật khẩu thành công!
        </h2>
        <p class="text-sm text-gray-600 leading-relaxed mb-6">
            Mật khẩu mới của bạn đã được cập nhật an toàn. Bây giờ bạn có thể đăng nhập bằng mật khẩu mới này.
        </p>
        <a href="{% url 'login' %}" class="inline-block px-8 py-3 bg-black text-white text-sm font-semibold uppercase tracking-wider rounded-md hover:bg-gray-800 transition">
            Đăng nhập ngay
        </a>
    </div>
</div>
{% endblock %}
