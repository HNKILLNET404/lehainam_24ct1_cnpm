{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Đăng ký - Urban Threads{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 bg-gray-50">
    <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-xl shadow-sm border border-gray-100">
        <div>
            <h2 class="text-center text-3xl font-bold uppercase tracking-tight text-gray-900">
                Tạo tài khoản
            </h2>
            <p class="mt-2 text-center text-sm text-gray-600">
                Đã có tài khoản?
                <a href="{% url 'login' %}" class="font-medium text-black hover:text-gray-700 underline">
                    Đăng nhập tại đây
                </a>
            </p>
        </div>
        
        <form class="mt-8 space-y-6" action="" method="POST">
            {% csrf_token %}
            {{ form|crispy }}

            <div>
                <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent text-sm font-semibold rounded-md text-white bg-black hover:bg-gray-800 focus:outline-none transition-colors">
                    Đăng ký
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
